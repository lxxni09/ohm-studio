# Kubernetes: kubectl apply -f deploy/k8s/nodaris.yaml
# Vorher Secret anlegen:
#   kubectl create secret generic nodaris --from-literal=SESSION_SECRET=$(openssl rand -hex 32) \
#     --from-literal=DATA_KEY=$(openssl rand -hex 32) --from-literal=SCIM_TOKEN=$(openssl rand -hex 24)
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: nodaris-data }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 10Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: nodaris, labels: { app: nodaris } }
spec:
  replicas: 1   # Live-Sitzungen liegen im Speicher: für mehrere Repliken Sticky Sessions am Ingress aktivieren
  selector: { matchLabels: { app: nodaris } }
  template:
    metadata: { labels: { app: nodaris } }
    spec:
      securityContext: { runAsNonRoot: true, fsGroup: 101 }
      containers:
        - name: nodaris
          image: nodaris/ohm-studio-server:2.0.0
          ports: [{ containerPort: 8787 }]
          envFrom: [{ secretRef: { name: nodaris } }]
          env:
            - { name: PUBLIC_URL, value: "https://ohm.firma.example" }
            - { name: ALLOWED_ORIGINS, value: "https://ohm.firma.example,app://ohm" }
          volumeMounts: [{ name: data, mountPath: /data }]
          readinessProbe: { httpGet: { path: /healthz, port: 8787 } }
          livenessProbe: { httpGet: { path: /healthz, port: 8787 }, periodSeconds: 30 }
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { memory: 512Mi } }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: nodaris-data }
---
apiVersion: v1
kind: Service
metadata: { name: nodaris }
spec:
  selector: { app: nodaris }
  ports: [{ port: 80, targetPort: 8787 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nodaris
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/ssl-protocols: "TLSv1.3"
spec:
  tls: [{ hosts: [ohm.firma.example], secretName: nodaris-tls }]
  rules:
    - host: ohm.firma.example
      http:
        paths: [{ path: /, pathType: Prefix, backend: { service: { name: nodaris, port: { number: 80 } } } }]
