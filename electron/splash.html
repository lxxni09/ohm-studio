<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:" />
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; cursor: default; }
  .card { position: absolute; inset: 0; border-radius: 14px; background: linear-gradient(160deg, #0a84ff 0%, #3a5bd9 55%, #5e5ce6 100%); color: #fff; font: 15px "Segoe UI Variable", "Segoe UI", system-ui, sans-serif; display: flex; flex-direction: column; justify-content: center; padding: 0 40px; box-sizing: border-box; }
  .row { display: flex; align-items: center; gap: 14px; }
  svg { flex: none; }
  h1 { font-size: 28px; font-weight: 600; margin: 0; letter-spacing: -0.02em; }
  .by { opacity: 0.85; font-size: 13px; margin-top: 2px; letter-spacing: 0.06em; }
  .bar { position: absolute; left: 40px; right: 40px; bottom: 34px; height: 3px; border-radius: 2px; background: rgba(255, 255, 255, 0.25); overflow: hidden; }
  .bar div { width: 35%; height: 100%; background: #fff; border-radius: 2px; animation: go 1.1s ease-in-out infinite; }
  @keyframes go { from { transform: translateX(-100%); } to { transform: translateX(290%); } }
  .ver { position: absolute; right: 40px; bottom: 46px; font-size: 11px; opacity: 0.7; }
</style>
</head>
<body>
  <div class="card">
    <div class="row">
      <svg width="54" height="54" viewBox="0 0 32 32"><circle cx="16" cy="16" r="16" fill="#fff" /><g stroke="#0A84FF" stroke-width="2.6" stroke-linecap="round"><path d="M16 16V5.5M16 16 6.9 21.3M16 16l9.1 5.3" /></g><circle cx="16" cy="16" r="4.6" fill="#0A84FF" /></svg>
      <div>
        <h1>Ohm Studio</h1>
        <div class="by">BY NODARIS</div>
      </div>
    </div>
    <div class="ver" id="v"></div>
    <div class="bar"><div></div></div>
  </div>
  <script>document.getElementById('v').textContent = 'Version ' + (new URLSearchParams(location.search).get('v') || '');</script>
</body>
</html>
