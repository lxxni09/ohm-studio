# Self-Hosted: docker compose up -d   →  http://localhost:8787
# Hinter einem Reverse-Proxy mit TLS 1.3 betreiben (z. B. Caddy, Traefik, nginx).
services:
  nodaris:
    build: .
    image: nodaris/ohm-studio-server:2.0.0
    restart: unless-stopped
    ports:
      - "8787:8787"
    volumes:
      - nodaris-data:/data
    environment:
      PUBLIC_URL: https://ohm.firma.example
      SESSION_SECRET: ${SESSION_SECRET:?bitte setzen}
      DATA_KEY: ${DATA_KEY:?64 Hex-Zeichen, z. B. openssl rand -hex 32}
      SCIM_TOKEN: ${SCIM_TOKEN:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      ALLOWED_ORIGINS: https://ohm.firma.example,app://ohm
      # Single Sign-On (OpenID Connect) – z. B. Microsoft Entra ID:
      # OIDC_ISSUER: https://login.microsoftonline.com/<tenant-id>/v2.0
      # OIDC_CLIENT_ID: ...
      # OIDC_CLIENT_SECRET: ...
      # Lizenz-IDs dieses Standorts (leer = alle gültig):
      LICENSES: ${LICENSES:-}
volumes:
  nodaris-data:
